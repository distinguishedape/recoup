[project]
name = "recoup"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recoup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two tasks legitimately name a test file test_engine.py (classify, policy).
# importlib import mode gives each its own module identity instead of
# deriving a name from the basename and colliding.
addopts = "--import-mode=importlib"
